# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Builds the pkgdown site and publishes it to the gh-pages branch, which GitHub Pages serves
# at https://wildobs.github.io/WildObsR/. Vignettes that query WildObs are precomputed
# (vignettes/precompute.R), so no API key is needed here.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

# only the latest push to main needs a site; an older build still running is superseded
concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # a site build has no reason to run long; stop an upstream stall early
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown publishes every top-level .md file, so drop the internal Claude notes from
      # this runner's checkout before building; the repository copy is untouched
      - name: Keep CLAUDE.md off the site
        run: rm -f CLAUDE.md

      # dest_dir must match the deploy folder below; without it this function writes to docs/
      - name: Build site
        run: pkgdown::build_site_github_pages(dest_dir = "pkgdown", new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # the site is built into pkgdown/, not docs/, which holds private files
      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: pkgdown
