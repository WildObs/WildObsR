# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  # Lets the check be run by hand, e.g. to re-test a platform that is no
  # longer part of the standing matrix before cutting a release.
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# A force-push to a PR branch supersedes the previous run. Without this, both
# generations run to completion; on 2026-08-19 both ran to the 6-hour ceiling.
# run_id in the fallback keeps pushes to main from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    # Nothing here has ever legitimately taken more than 35 minutes. Without
    # this, an upstream apt/mirror stall runs to GitHub's 6-hour ceiling
    # (2026-08-19: 15 jobs x 6h = 5,415 minutes, 271% of the monthly allowance).
    timeout-minutes: 30

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # One entry. The macOS, Windows, R-devel and oldrel-1 entries cost ~90%
        # of the bill and have never once disagreed with this one. Use
        # workflow_dispatch to run the wider set by hand before a release.
        config:
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
